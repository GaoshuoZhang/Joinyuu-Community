<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f3f3" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('joinyuu_theme')
          var dark = mode === 'dark' || ((mode === null || mode === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          if (dark) {
            root.classList.add('dark')
            root.setAttribute('theme-mode', 'dark')
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#181818')
          } else {
            root.setAttribute('theme-mode', 'light')
          }
        } catch (e) {
          /* 隐私模式下 localStorage 不可用，按浅色启动 */
        }
      })()
    </script>
    <link rel="preconnect" href="https://tdesign.gtimg.com" crossorigin />
    <meta name="description" content="聚屿社区客户端 — 需求广场、活动报名、积分商城与社区生活" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>聚屿社区</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
