services:
  postgres:
    image: postgres:17-alpine
    container_name: joinyuu-pg
    restart: unless-stopped
    ports:
      - "5432:5432" # 本机 5432 被占用时改为 55432:5432 并同步 apps/api/.env
    environment:
      POSTGRES_USER: joinyuu
      POSTGRES_PASSWORD: joinyuu
      POSTGRES_DB: joinyuu
    volumes:
      - joinyuu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joinyuu"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    container_name: joinyuu-redis
    restart: unless-stopped
    ports:
      - "6379:6379" # 被占用时同理改为 56379:6379
    volumes:
      - joinyuu-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  joinyuu-pgdata:
  joinyuu-redisdata:
