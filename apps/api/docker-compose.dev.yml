services:
  postgres:
    image: postgres:17-alpine
    container_name: joinyuu-pg
    restart: unless-stopped
    ports:
      - "5432:5432" # 本机 5432 被占用时改为 55432:5432 并同步 apps/api/.env
    environment:
      POSTGRES_USER: joinyuu
      POSTGRES_PASSWORD: joinyuu
      POSTGRES_DB: joinyuu
    volumes:
      - joinyuu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joinyuu"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    container_name: joinyuu-redis
    restart: unless-stopped
    ports:
      - "6379:6379" # 被占用时同理改为 56379:6379
    volumes:
      - joinyuu-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    container_name: joinyuu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin # 控制台登录 User 框（即 AccessKey）
      MINIO_ROOT_PASSWORD: minioadmin # 控制台登录 Password 框（即 SecretKey）
    ports:
      - "9000:9000" # S3 API（系统配置中 Endpoint 对应本机 127.0.0.1:9000）
      - "9001:9001" # 控制台 http://127.0.0.1:9001（User=minioadmin / Password=minioadmin）
    volumes:
      - joinyuu-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
volumes:
  joinyuu-pgdata:
  joinyuu-redisdata:
  joinyuu-minio-data:
