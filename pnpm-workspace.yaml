packages:
  - 'apps/*'
  - 'packages/*'
nodeLinker: hoisted
supportedArchitectures:
  os:
    - linux
    - win32
verifyDepsBeforeRun: false
allowBuilds:
  # The package ships compiled output; its legacy postinstall only targets Node 10/12.
  '@alicloud/openapi-core': false
  '@prisma/client': true
  '@prisma/engines': true
  es5-ext: true
  esbuild: true
  prisma: true
  vue-demi: true
